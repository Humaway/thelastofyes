  addBlood(c) { if (!c.blood) { const m = Build.mat('bloodWet', { color: 0x7a0a08, roughness: .18 }), s = c.s; c.blood = [];
      for (const [j, x, y, z, r] of [['hand_r', .012, -.072, .016, .02], ['hand_r', -.016, -.05, .016, .014], ['hand_r', .004, -.03, -.016, .012], ['fing_r', .01, -.012, .011, .016], ['fing_r', -.018, -.02, .01, .011]]) {
        const g = new THREE.SphereGeometry(r * s, 14, 10); g.scale(1.35, 1, .3); const b = new THREE.Mesh(g, m); b.position.set(x * s, y * s, z * s); c.J[j].add(b); c.blood.push(b); } }
    c.blood.forEach(b => b.visible = true); },
  gestureEvent(c, name) { if (name === 'counter') Audio.sfx('counter', Chars.point(c, 'hand_r', new V3())); },
  onUnlock() { if (this.needsLook() && !UI.paused && this.seg !== 'title' && this.seg !== 'end') UI.pause(); },
  onCanvasClick() { if (!UI.paused && this.needsLook()) Input.lock(); },
};
// phone glow on faces: the lit hero phone lends its light to the rig's last point light
function phoneGlow() { const who = Game.litPhone, P = Rig.pts[5]; if (!Game.area || ((Game.area.id === 'R' || Game.area.id === 'B') && who !== 'scroller4')) return; const c = who && Chars.all[who], ph = who && (Game.phones[who] || { on: true }), m = !c ? null : who === 'chase' ? Game.chaseMobile : c.props.phone || Game.bubPhoneProp;
  if (!m || !m.visible || !ph.on || !m.parent || !c.root.visible) { if (Game.glowOn) { Game.glowOn = false; const c5 = Rig.cfg && Rig.cfg.pts && Rig.cfg.pts[5]; P.intensity = c5 ? c5.i : 0; if (c5) { P.position.set(...c5.p).add(Rig.origin); P.color.set(c5.c); P.distance = c5.d; } } return; }
  Game.glowOn = true; m.updateWorldMatrix(true, false); P.position.copy(new V3(0, 0, .22).applyMatrix4(m.matrixWorld)); P.color.set(0xa8c8ff); P.intensity = .32; P.distance = 1.4; }

// =====================================================================
// Main loop
// =====================================================================
function loop() { requestAnimationFrame(loop); frame(); }
function frame() {
  const dt = Engine.tick(); Input.poll();
  if (!Engine.paused) { Game.update(dt); Director.update(dt); Play.update(dt); AI.update(dt); Anim.update(dt); if (Director.active) Director.camera(dt); Dialogue.update(dt); phoneGlow(); }
  Audio.update(Engine.rawDt); UI.update(Engine.rawDt); Cam.apply(Engine.rawDt, Director.active ? Director.near || .1 : .1); Engine.render(); Input.endFrame();
}
Game.boot().then(() => requestAnimationFrame(loop)).catch(e => { $('#boot .pct').textContent = 'Something went wrong while building the world: ' + e.message; throw e; });

</script>
