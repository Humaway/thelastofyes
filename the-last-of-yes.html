// Shared helpers. Keep this small; module-specific helpers live inside their module closure.
const U = (() => {
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const inv = (a, b, v) => (v - a) / (b - a);
  const remap = (a, b, c, d, v) => lerp(c, d, clamp(inv(a, b, v)));
  // frame-rate independent exponential smoothing
  const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
  const smooth = t => t * t * (3 - 2 * t);
  const ease = {
    linear: t => t,
    in: t => t * t,
    out: t => 1 - (1 - t) * (1 - t),
    inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    sine: t => 0.5 - 0.5 * Math.cos(Math.PI * t),
    outBack: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  };
  const wrapAngle = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
  const angleDamp = (a, b, lambda, dt) => a + wrapAngle(b - a) * (1 - Math.exp(-lambda * dt));
  // Seeded PRNG (mulberry32). U.rng(seed) -> () => [0,1)
  const rng = seed => { let s = (seed >>> 0) || 1; return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rand = rng(12345);                       // shared non-critical randomness
  const range = (a, b, r = rand) => a + (b - a) * r();
  const pick = (arr, r = rand) => arr[Math.floor(r() * arr.length)];
  const v3 = (a, out = new THREE.Vector3()) => Array.isArray(a) ? out.set(a[0], a[1] ?? 0, a[2] ?? 0) : out.copy(a);
  const yawTo = (from, to) => Math.atan2(to.x - from.x, to.z - from.z);   // yaw that faces +Z toward target
  const fwd = (yaw, out = new THREE.Vector3()) => out.set(Math.sin(yaw), 0, Math.cos(yaw));
  const dist2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const lensToFov = mm => 2 * Math.atan(24 / (2 * mm)) * 180 / Math.PI;   // 36x24mm sensor, vertical FOV
  const words = s => (s.match(/\S+/g) || []).length;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  return { TAU, clamp, lerp, inv, remap, damp, smooth, ease, wrapAngle, angleDamp, rng, hash, rand, range, pick, v3, yawTo, fwd, dist2, lensToFov, words, sleep };
})();

// ===== 100_engine.js =====
// ============================================================================
// Engine — renderer, post-processing (bloom, DOF, grade, output, FXAA), environment
// lighting, colour grades, dynamic resolution. Owned by: core.
// Engine.camera is the ONLY rendered camera; Director.camUpdate() poses it every frame.
// ============================================================================
const Engine = (() => {
  let renderer, scene, camera, composer, overlay;
  let renderPass, overlayPass, bloomPass, bokehPass, gradePass, outputPass, fxaaPass;
  let pmrem, envTex = null;
  const size = { w: 1, h: 1 };
  let scale = 1, perfAcc = 0, perfN = 0, perfGood = 0;
  const focusTmp = new THREE.Vector3();

  const GradeShader = {
    uniforms: {
      tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },
      uExposure: { value: 1 }, uSat: { value: 1 }, uContrast: { value: 1 },
      uLift: { value: new THREE.Vector3() }, uGamma: { value: new THREE.Vector3(1, 1, 1) }, uGain: { value: new THREE.Vector3(1, 1, 1) },
      uVignette: { value: 0.3 }, uGrain: { value: 0.2 }, uFringe: { value: 0.1 },
      uDesat: { value: 0 },      // pause / airplane mode
      uListen: { value: 0 },     // airplane mode darkening
      uNightShift: { value: 0 }, // red goggle view
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uTime, uExposure, uSat, uContrast, uVignette, uGrain, uFringe, uDesat, uListen, uNightShift;
      uniform vec3 uLift, uGamma, uGain; uniform vec2 uRes; varying vec2 vUv;
      float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
      void main(){
        vec2 d = vUv - 0.5; float r2 = dot(d, d);
        vec2 off = d * uFringe * 0.012 * (0.3 + r2 * 2.0);
        vec3 c = vec3(texture2D(tDiffuse, vUv - off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + off).b);
        c *= uExposure;
        c = 0.18 * pow(max(c, 0.0) / 0.18, vec3(uContrast));
        c = c * uGain + uLift;
        c = pow(max(c, 0.0), 1.0 / uGamma);
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        c = mix(vec3(l), c, uSat * (1.0 - uDesat));
        c *= 1.0 - uListen * 0.45;
        if (uNightShift > 0.0) { vec3 red = vec3(l * 1.6, l * 0.18, l * 0.12); c = mix(c, red, uNightShift); c *= 1.0 - uNightShift * smoothstep(0.12, 0.4, r2) * 0.8; }
        float vig = smoothstep(0.75, 0.15, r2 * (1.0 + uVignette));
        c *= mix(1.0, vig, uVignette);
        float g = h12(vUv * uRes + fract(uTime * 13.7) * 91.0) - 0.5;
        c += g * uGrain * 0.06 * (0.25 + sqrt(max(l, 0.0)));
        gl_FragColor = vec4(max(c, 0.0), 1.0);
      }`,
  };

  // Active grade (numbers only) and blend state.
  const grade = JSON.parse(JSON.stringify(CONTENT.grades.neutral));
  let gradeFrom = null, gradeTo = null, gradeT = 0, gradeDur = 0;

  const dof = { enabled: false, target: null, focus: 5, aperture: 0.0025, maxblur: 0.008 };

  function init(parent) {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    parent.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    overlay = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, 16 / 9, 0.05, 1200);
    scene.add(camera);
    pmrem = new THREE.PMREMGenerator(renderer);

    composer = new EffectComposer(renderer);
    renderPass = new RenderPass(scene, camera);
    overlayPass = new RenderPass(overlay, camera); overlayPass.clear = false; overlayPass.clearDepth = true;
    bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.6, 0.5, 0.85);
    bokehPass = new BokehPass(scene, camera, { focus: 5, aperture: 0.0025, maxblur: 0.008 });
    bokehPass.enabled = false;
    gradePass = new ShaderPass(GradeShader);
    outputPass = new OutputPass();
    fxaaPass = new ShaderPass(FXAAShader);
    composer.addPass(renderPass);
    composer.addPass(overlayPass);
    composer.addPass(bloomPass);
    composer.addPass(bokehPass);
    composer.addPass(gradePass);
    composer.addPass(outputPass);
    composer.addPass(fxaaPass);
    addEventListener('resize', resize);
    setQuality(SETTINGS.quality);
    applyGrade();
  }

  function resize() {
    size.w = innerWidth; size.h = innerHeight;
    const q = CONFIG.quality[SETTINGS.quality] || CONFIG.quality.high;
    const pr = Math.min(devicePixelRatio || 1, q.pixelRatioCap) * scale;
    renderer.setPixelRatio(pr);
    renderer.setSize(size.w, size.h, false);
    composer.setPixelRatio(pr);
    composer.setSize(size.w, size.h);
    camera.aspect = size.w / size.h; camera.updateProjectionMatrix();
    const W = size.w * pr, H = size.h * pr;
    fxaaPass.material.uniforms.resolution.value.set(1 / W, 1 / H);
    gradePass.material.uniforms.uRes.value.set(W, H);
    bloomPass.resolution.set(W / 2, H / 2);
  }

  function setQuality(name) {
    const q = CONFIG.quality[name] || CONFIG.quality.high;
    scale = q.scale;
    renderer.shadowMap.enabled = q.shadows;
    fxaaPass.enabled = q.fxaa;
    Engine.shadowMapSize = q.shadowMap;
    resize();
  }

  // Grade: name from CONTENT.grades or a partial params object; blends over dur seconds.
  function setGrade(g, dur = 0) {
    const target = Object.assign(JSON.parse(JSON.stringify(CONTENT.grades.neutral)), typeof g === 'string' ? CONTENT.grades[g] : g);
    if (dur <= 0) { Object.assign(grade, target); gradeTo = null; applyGrade(); return; }
    gradeFrom = JSON.parse(JSON.stringify(grade)); gradeTo = target; gradeT = 0; gradeDur = dur;
  }
  function mixGrade(a, b, t) {
    for (const k in b) {
      if (Array.isArray(b[k])) grade[k] = b[k].map((v, i) => U.lerp(a[k][i], v, t));
      else if (typeof b[k] === 'number') grade[k] = U.lerp(a[k], b[k], t);
    }
  }
  function applyGrade() {
    const u = gradePass.material.uniforms;
    u.uExposure.value = grade.exposure; u.uSat.value = grade.sat; u.uContrast.value = grade.contrast;
    u.uLift.value.fromArray(grade.lift); u.uGamma.value.fromArray(grade.gamma); u.uGain.value.fromArray(grade.gain);
    u.uVignette.value = grade.vignette;
    u.uGrain.value = SETTINGS.grain ? grade.grain : 0;

    let rt;
    if (opts === 'room') rt = pmrem.fromScene(new RoomEnvironment(renderer), 0.04);
    else {

      const top = new THREE.Color(opts.top ?? 0x445566), hor = new THREE.Color(opts.horizon ?? 0x887766), bot = new THREE.Color(opts.bottom ?? 0x222018);

  }

  function dynRes(dt) {
    const q = CONFIG.quality[SETTINGS.quality] || CONFIG.quality.high;
    perfAcc += dt; perfN++;
    if (perfAcc < 1) return;
    const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
    if (avg > 0.02 && scale > 0.6) { scale = Math.max(0.6, +(scale - 0.1).toFixed(2)); perfGood = 0; resize(); }
    else if (avg < 0.014 && scale < q.maxScale) { if (++perfGood >= 3) { scale = Math.min(q.maxScale, +(scale + 0.1).toFixed(2)); perfGood = 0; resize(); } }

    init, render, resize, setQuality, setGrade, setEnv, grade, dof, applyGrade,
    get renderer() { return renderer; }, get scene() { return scene; }, get camera() { return camera; },
    get overlay() { return overlay; }, get composer() { return composer; }, get size() { return size; },
    get uniforms() { return gradePass.material.uniforms; }, get time() { return time; },
    shadowMapSize: 2048,
  };
})();

// ===== 110_input.js =====
// ============================================================================
// Input — keyboard, mouse (pointer lock), gamepad (standard mapping); named actions.
// Owned by: core.
//   Input.down(a) held now · Input.pressed(a) went down this frame · Input.released(a)
//   Input.heldTime(a) seconds held · Input.move {x,y} (y = forward) · Input.look {x,y} (per-frame delta, radians-ish)
//   Input.typed: array of printable keys pressed this frame (for typing beats) · Input.anyPressed
//   Input.device 'kbm' | 'pad'
// ============================================================================
const Input = (() => {
  const KEYS = {
    up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    sprint: ['ShiftLeft', 'ShiftRight'], crouch: ['KeyC'], jump: ['Space'], interact: ['KeyE'], listen: ['KeyQ'],
    reload: ['KeyR'], melee: ['KeyF'], throw: ['KeyG'], backpack: ['Tab'], hint: ['KeyT'], skip: ['Space'],
    pause: ['Escape', 'KeyP'], confirm: ['Enter', 'Space'], back: ['Escape', 'Backspace'],
    slot1: ['Digit1'], slot2: ['Digit2'], slot3: ['Digit3'], slot4: ['Digit4'],
    menuUp: ['ArrowUp', 'KeyW'], menuDown: ['ArrowDown', 'KeyS'], menuLeft: ['ArrowLeft', 'KeyA'], menuRight: ['ArrowRight', 'KeyD'],
  };
  // gamepad standard mapping button indices
  const PAD = {
    jump: [0], confirm: [0], skip: [0], crouch: [1], back: [1], interact: [2], reload: [2], melee: [3],
    listen: [5], throw: [5], aim: [6], fire: [7], backpack: [8], pause: [9], sprint: [10], shoulder: [11],
    menuUp: [12], menuDown: [13], menuLeft: [14], menuRight: [15], slot1: [12], slot2: [15], slot3: [13], slot4: [14],
  };
  const keys = new Set(), mouse = new Set(), hit = new Set(), mhit = new Set(); // hit*: went down since last update (catches taps shorter than a frame)
  const state = {}, prev = {}, held = {};
  const move = { x: 0, y: 0 }, look = { x: 0, y: 0 };
  let mdx = 0, mdy = 0, wheel = 0, typed = [], anyPressed = false, anyKey = false;
  let device = 'kbm', locked = false;
  const actions = new Set([...Object.keys(KEYS), ...Object.keys(PAD), 'aim', 'fire', 'shoulder', 'next', 'prev']);

  function init() {
    addEventListener('keydown', e => {
      if (e.code === 'Tab' || e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (!e.repeat) { keys.add(e.code); hit.add(e.code); anyKey = true; if (e.key.length === 1) typed.push(e.key); }
      device = 'kbm';
    });
    addEventListener('keyup', e => keys.delete(e.code));
    addEventListener('blur', () => { keys.clear(); mouse.clear(); });
    addEventListener('mousedown', e => { mouse.add(e.button); mhit.add(e.button); anyKey = true; device = 'kbm'; });
    addEventListener('mouseup', e => mouse.delete(e.button));
    addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('mousemove', e => { if (locked) { mdx += e.movementX; mdy += e.movementY; } });
    addEventListener('wheel', e => { wheel += Math.sign(e.deltaY); }, { passive: true });
    document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement != null; });
  }

  function lock() { if (!locked && !CONFIG.dev) Engine.renderer.domElement.requestPointerLock?.()?.catch?.(() => {}); }
  function unlock() { if (locked) document.exitPointerLock?.(); }

  function update(dt) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = [...pads].find(p => p && p.mapping === 'standard') || null;
    const pb = i => gp && gp.buttons[i] && gp.buttons[i].pressed;
    if (gp && gp.buttons.some(b => b.pressed)) device = 'pad';
    for (const a of actions) {
      prev[a] = state[a] || false;
      let d = (KEYS[a] || []).some(k => keys.has(k) || hit.has(k)) || (PAD[a] || []).some(pb);
      if (a === 'aim') d = d || mouse.has(2) || mhit.has(2);
      if (a === 'fire') d = d || mouse.has(0) || mhit.has(0);
      if (a === 'shoulder') d = d || mouse.has(1) || mhit.has(1);
      state[a] = d;
      held[a] = d ? (held[a] || 0) + dt : 0;
    }
    state.next = wheel > 0; state.prev = wheel < 0; wheel = 0;
    // movement
    let mx = (state.right ? 1 : 0) - (state.left ? 1 : 0), my = (state.up ? 1 : 0) - (state.down ? 1 : 0);
    const dz = v => Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82;
    if (gp) { const ax = dz(gp.axes[0] || 0), ay = dz(gp.axes[1] || 0); if (ax || ay) { mx = ax; my = -ay; device = 'pad'; } }
    const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }
    move.x = mx; move.y = my;
    // look
    const s = SETTINGS.sens, inv = SETTINGS.invertY ? -1 : 1;
    look.x = mdx * 0.0022 * s; look.y = mdy * 0.0022 * s * inv; mdx = mdy = 0;
    if (gp) { const rx = dz(gp.axes[2] || 0), ry = dz(gp.axes[3] || 0); look.x += rx * 2.6 * s * dt; look.y += ry * 1.8 * s * dt * inv; }
    anyPressed = anyKey; anyKey = false; hit.clear(); mhit.clear();
    Input.typed = typed; typed = [];
    Input.anyPressed = anyPressed;
  }

  return {
    init, update, lock, unlock, move, look, typed: [], anyPressed: false,
    down: a => !!state[a], pressed: a => !!state[a] && !prev[a], released: a => !state[a] && !!prev[a], heldTime: a => held[a] || 0,
    get device() { return device; }, get locked() { return locked; },
  };
})();

// ===== 175_world.js =====
// ============================================================================
// World — collision, ground height, line-of-sight raycasts against the current area's
// axis-aligned boxes. Owned by: core. Colliders are registered by Build/levels via
// World.addBox and cleared by Game when an area unloads.
// ============================================================================
const World = (() => {
  const boxes = [];            // { min: Vector3, max: Vector3, surface, walk (top is walkable), block (blocks movement), sight (blocks LOS) }
  const surfaces = [];         // { x1, z1, x2, z2, name } footstep surface zones (last added wins)
  let terrain = null;          // optional (x, z) => ground height
  let baseSurface = 'concrete';
  let owner = null;            // area id that new boxes/surfaces belong to (set by Game while building)
  const STEP = 0.45;

  function addBox(min, max, o = {}) {
    const b = { area: owner, min: U.v3(min).clone(), max: U.v3(max).clone(), surface: o.surface || null, walk: o.walk !== false, block: o.block !== false, sight: o.sight !== false, cam: o.cam !== false, tag: o.tag || null };
    boxes.push(b); return b;
  }
  // From a mesh/group's world bounding box.
  function addObject(obj, o = {}) { obj.updateWorldMatrix(true, true); const bb = new THREE.Box3().setFromObject(obj); return addBox(bb.min, bb.max, o); }
  function removeBox(b) { const i = boxes.indexOf(b); if (i >= 0) boxes.splice(i, 1); }
  // clear(areaId) removes that area's boxes/surfaces; clear() removes everything
  function clear(areaId) {
    if (areaId == null) { boxes.length = 0; surfaces.length = 0; terrain = null; baseSurface = 'concrete'; return; }
    for (const l of [boxes, surfaces]) for (let i = l.length - 1; i >= 0; i--) if (l[i].area === areaId) l.splice(i, 1);
  }

  function groundAt(x, z, y = 1e4, r = 0) {
    let g = terrain ? terrain(x, z) : 0;
    for (const b of boxes) {
      if (!b.walk || b.max.y > y + STEP) continue;
      if (x + r < b.min.x || x - r > b.max.x || z + r < b.min.z || z - r > b.max.z) continue;
      if (b.max.y > g) g = b.max.y;
    }
    return g;
  }

  // Slide a circle (radius r) at feet height y by (dx, dz). Returns {x, z, hit}.
  const res = { x: 0, z: 0, hit: false };
  function move(x, y, z, dx, dz, r = 0.35, h = 1.7) {
    res.hit = false;
    let nx = x + dx, nz = z + dz;
    for (let iter = 0; iter < 3; iter++) {
      let any = false;
      for (const b of boxes) {
        if (!b.block || b.max.y <= y + STEP || b.min.y >= y + h) continue;
        // closest point on box (XZ) to circle centre
        const cx = U.clamp(nx, b.min.x, b.max.x), cz = U.clamp(nz, b.min.z, b.max.z);
        let ox = nx - cx, oz = nz - cz; const d2 = ox * ox + oz * oz;
        if (d2 >= r * r) continue;
        any = true; res.hit = true;
        if (d2 > 1e-8) { const d = Math.sqrt(d2), push = r - d; nx += ox / d * push; nz += oz / d * push; }
        else { // centre inside box: push out along the shallowest axis
          const px1 = nx - b.min.x, px2 = b.max.x - nx, pz1 = nz - b.min.z, pz2 = b.max.z - nz, m = Math.min(px1, px2, pz1, pz2);
          if (m === px1) nx = b.min.x - r; else if (m === px2) nx = b.max.x + r; else if (m === pz1) nz = b.min.z - r; else nz = b.max.z + r;
        }
      }
      if (!any) break;
    }
    res.x = nx; res.z = nz; return res;
  }

  // Segment vs boxes (slab test). Returns t in [0,1] of the first hit, 1 if clear.
  // filter: 'sight' (LOS) or 'cam' (camera collision) or null (any blocking box)
  function raycast(from, to, filter = 'sight') {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
    let best = 1;
    for (const b of boxes) {
      if (filter && !b[filter]) continue;
      let t0 = 0, t1 = best, ok = true;
      for (const [o, d, mn, mx] of [[from.x, dx, b.min.x, b.max.x], [from.y, dy, b.min.y, b.max.y], [from.z, dz, b.min.z, b.max.z]]) {
        if (Math.abs(d) < 1e-9) { if (o < mn || o > mx) { ok = false; break; } continue; }
        let a = (mn - o) / d, c = (mx - o) / d; if (a > c) [a, c] = [c, a];
        if (a > t0) t0 = a; if (c < t1) t1 = c; if (t0 > t1) { ok = false; break; }
      }
      if (ok && t0 < best && t0 > 0) best = t0;
    }
    return best;
  }
  const visible = (a, b) => raycast(a, b, 'sight') >= 0.999;

  function addSurface(x1, z1, x2, z2, name) { surfaces.push({ area: owner, x1: Math.min(x1, x2), z1: Math.min(z1, z2), x2: Math.max(x1, x2), z2: Math.max(z1, z2), name }); }
  function surfaceAt(x, z, y = 1e4) {
    for (let i = surfaces.length - 1; i >= 0; i--) { const s = surfaces[i]; if (x >= s.x1 && x <= s.x2 && z >= s.z1 && z <= s.z2) return s.name; }
    let top = null, g = -1e9;
    for (const b of boxes) if (b.surface && b.max.y <= y + STEP && b.max.y > g && x >= b.min.x && x <= b.max.x && z >= b.min.z && z <= b.max.z) { g = b.max.y; top = b.surface; }
    return top || baseSurface;
  }

  return {
    boxes, addBox, addObject, removeBox, clear, groundAt, move, raycast, visible, addSurface, surfaceAt, STEP,
    set terrain(fn) { terrain = fn; }, get terrain() { return terrain; },
    set baseSurface(s) { baseSurface = s; }, get baseSurface() { return baseSurface; },
    set owner(id) { owner = id; }, get owner() { return owner; },
  };
})();

// ===== 180_play.js =====
// ============================================================================
// Play — player controller, third-person camera, (later) combat, stealth, crafting,
// inventory, health. Owned by: core (Prologue scope) then systems agent (Chapter 1+).
//
// CONTRACT
//   Play.setPlayer(char | null, profile)  profile: { walk=1.5, jog=3.2, run=5.2 (0 disables), accel=8, canCrouch, canJump,
//        combat=false, hud=false, carry: Character (being carried; forces carry gait), limp, speedMul, footsteps=true }
//   Play.char, Play.enabled, Play.enable(on)      (disabled = no input; camera still follows)
//   Play.update(dt)                                reads Input, moves the player with World collisions, updates camPose
//   Play.camPose { pos: Vector3, target: Vector3, fov }   gameplay camera (Director blends to/from this)
//   Play.snapCamera()                              place camPose behind the player instantly (after teleports)
//   Play.lookMode(anchor Object3D | null, {yaw:[min,max], pitch:[min,max], fov, offset:[x,y,z]})  camera-only look-around from an
//        anchor (e.g. a car back seat). Input.look rotates within limits; movement disabled. null returns to OTS.
//   Play.forceLook(point | null, strength 0..1)    pull the view toward a point (e.g. "camera is forced away" beats)
//   Play.nudge(point, dur=1)                       soft camera nudge toward a subject without taking control
//   Play.shake(amount, dur)                        camera shake (respects SETTINGS.shake)
//   Play.health / Play.maxHealth / Play.damage(n, src) / Play.heal(n)  → Game.die() at 0
//   Play.inventory, Play.resetInventory(), Play.setInventory(obj), Play.give(item, n)
// ============================================================================
const Play = (() => {
  let char = null, profile = {}, enabled = false;
  const camPose = { pos: new THREE.Vector3(0, 2, 5), target: new THREE.Vector3(), fov: 70 };
  let camYaw = 0, camPitch = 0.12, speed = 0, lookAnchor = null, lookOpts = null, lookYaw = 0, lookPitch = 0;
  let nudge = null, forced = null, shakeAmt = 0, shakeT = 0, stepAcc = 0;
  const vel = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3(), camDist = { v: 2.2 };
  const DEF = { walk: 1.5, jog: 3.2, run: 5.2, accel: 8, footsteps: true };

  function setPlayer(c, p = {}) { char = c; profile = Object.assign({}, DEF, p); speed = 0; if (c) { camYaw = c.yaw + Math.PI; snapCamera(); } }
  function enable(on) { enabled = !!on; if (on) Input.lock(); }
  function snapCamera() { if (!char) return; camYaw = char.yaw; camPitch = 0.12; computeOts(1e3); }

  function computeOts(dt) {
    const p = char.root.position;
    const back = camDist.v, side = 0.45, h = 1.55 * (char.height / 1.8);
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
    const pivot = tmp.set(p.x, p.y + h, p.z);
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    const want = tmp2.set(pivot.x - fx * back * cp + fz * -side, pivot.y + sp * back, pivot.z - fz * back * cp - fx * -side);
    // camera collision: pull in toward the pivot
    const t = World.raycast(pivot, want, 'cam');
    if (t < 1) want.lerpVectors(pivot, want, Math.max(0.15, t - 0.08));
    const k = 1 - Math.exp(-18 * dt);
    camPose.pos.lerp(want, k);
    const look = pivot.clone().add(new THREE.Vector3(fx * 4, -sp * 2.5, fz * 4)).add(new THREE.Vector3(fz * -side * 0.5, 0, -fx * -side * 0.5));
    if (nudge) { nudge.t += dt; const w = Math.sin(Math.PI * U.clamp(nudge.t / nudge.dur)) * 0.35; look.lerp(nudge.point, w); if (nudge.t >= nudge.dur) nudge = null; }
    camPose.target.lerp(look, k);
    camPose.fov = SETTINGS.fov;
  }

  function update(dt) {
    if (!char) return;
    if (lookAnchor) { updateLook(dt); return; }
    const ctl = enabled && !Director.active;
    // camera orbit
    if (ctl) { camYaw -= Input.look.x; camPitch = U.clamp(camPitch + Input.look.y, -0.5, 0.9); }
    // movement relative to camera
    let mx = ctl ? Input.move.x : 0, my = ctl ? Input.move.y : 0;
    const carry = !!profile.carry;
    let top = profile.walk;
    if (ctl && Input.down('sprint') && profile.run > 0 && !carry) top = profile.run;
    else if (carry || profile.limp) top = profile.jog > 0 ? Math.min(profile.jog, carry ? 2.4 : 1.2) : profile.walk;
    else if (Math.hypot(mx, my) > 0.6 && profile.jog > 0) top = profile.jog;
    top *= profile.speedMul ?? 1;
    const inputMag = Math.min(1, Math.hypot(mx, my));
    const target = inputMag * top;
    speed = U.damp(speed, target, target > speed ? profile.accel * 0.6 : profile.accel, dt);
    if (inputMag > 0.05) {
      const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
      const dx = fx * my - fz * mx, dz = fz * my + fx * mx;   // camera-forward/right
      const want = Math.atan2(dx, dz);
      char.yaw = U.angleDamp(char.yaw, want, speed > 4 ? 5 : 10, dt);
    }
    if (speed > 0.01) {
      const p = char.root.position, f = U.fwd(char.yaw, tmp);
      const r = World.move(p.x, p.y, p.z, f.x * speed * dt, f.z * speed * dt, 0.33, char.height);
      p.x = r.x; p.z = r.z;
      const g = World.groundAt(p.x, p.z, p.y + 0.01, 0.1);
      p.y = g > p.y ? U.damp(p.y, g, 25, dt) : Math.max(g, p.y - 6 * dt);
      if (profile.footsteps) { stepAcc += speed * dt; const stride = speed > 4 ? 1.6 : 1.25; if (stepAcc > stride) { stepAcc = 0; Audio.footstep(World.surfaceAt(p.x, p.z, p.y), p, U.clamp(speed / 5)); } }
    }
    char.setMove(speed, { carry, limp: profile.limp });
    camDist.v = U.damp(camDist.v, 2.2, 4, dt);
    computeOts(dt);
    applyShake(dt);
  }

  function updateLook(dt) {
    const o = lookOpts;
    if (enabled) { lookYaw = U.clamp(lookYaw - Input.look.x, o.yaw[0], o.yaw[1]); lookPitch = U.clamp(lookPitch - Input.look.y, o.pitch[0], o.pitch[1]); }
    if (forced) { lookYaw = U.damp(lookYaw, forced.yaw, 6 * forced.k, dt); }
    lookAnchor.updateWorldMatrix(true, false);
    camPose.pos.set(...(o.offset || [0, 0, 0])).applyMatrix4(lookAnchor.matrixWorld);
    const q = new THREE.Quaternion().setFromRotationMatrix(lookAnchor.matrixWorld);
    const dir = tmp.set(Math.sin(lookYaw) * Math.cos(lookPitch), Math.sin(lookPitch), Math.cos(lookYaw) * Math.cos(lookPitch)).applyQuaternion(q);
    camPose.target.copy(camPose.pos).add(dir);
    camPose.fov = o.fov || SETTINGS.fov;
    applyShake(dt);
  }
  function lookMode(anchor, o = {}) { lookAnchor = anchor; lookOpts = Object.assign({ yaw: [-2, 2], pitch: [-0.6, 0.5] }, o); lookYaw = o.startYaw || 0; lookPitch = 0; if (!anchor) forced = null; }
  // yaw-space force toward a world point (look mode) — computed relative to anchor
  function forceLook(point, k = 1) {
    if (!point || !lookAnchor) { forced = null; return; }
    const inv = new THREE.Matrix4().copy(lookAnchor.matrixWorld).invert();
    const lp = U.v3(point, tmp).applyMatrix4(inv);
    forced = { yaw: Math.atan2(lp.x, lp.z), k };
  }
  function applyShake(dt) {
    if (shakeT <= 0 || !SETTINGS.shake) return;
    shakeT -= dt; const a = shakeAmt * U.clamp(shakeT * 2);
    camPose.pos.x += (Math.random() - 0.5) * a; camPose.pos.y += (Math.random() - 0.5) * a;
  }

  const inventory = {};
  function resetInventory() { for (const k in inventory) delete inventory[k]; Object.assign(inventory, { ammo: {}, items: {}, weapons: [] }); }
  resetInventory();

  return {
    setPlayer, enable, update, snapCamera, lookMode, forceLook, camPose, inventory, resetInventory,
    setInventory(o) { resetInventory(); Object.assign(inventory, JSON.parse(JSON.stringify(o))); },
    give(item, n = 1) { inventory.items[item] = (inventory.items[item] || 0) + n; },
    nudge(point, dur = 1) { nudge = { point: U.v3(point).clone(), dur, t: 0 }; },
    shake(a, d) { shakeAmt = a; shakeT = d; },
    health: 100, maxHealth: 100, damage() {}, heal() {},
    get char() { return char; }, get enabled() { return enabled; }, get speed() { return speed; }, get profile() { return profile; },
    get camYaw() { return camYaw; }, set camYaw(v) { camYaw = v; },
  };
})();

// ===== 190_director.js =====
// ============================================================================
// Director — plays cutscene scripts from CONTENT.scenes; owns the final camera pose each
// frame (blends gameplay <-> cinematic), letterbox, DOF focus, cues. Owned by: cinema agent.
// THIS IS A STUB: keep every API below, replace the implementation. Full format: ARCHITECTURE.md.
//
// CONTRACT
//   Director.play(id, {skippable}) -> Promise   resolves when the scene ends (after its exit blend starts)
//   Director.active (bool), Director.sceneId
//   Director.update(dt)       advance scene time: actions, lines, cues, shot changes
//   Director.camUpdate(dt)    write Engine.camera from: active shot | manual pose | blend-out | Play.camPose
//   Director.stop()           abort silently (flow cancelled)
//   Director.skip()           jump to end state, apply side effects (scene.end), blend to gameplay
//   Director.manual(pose | null)  free camera override outside scenes (title screen, drive): {pos, target, fov} (Vector3s)
// ============================================================================
const Director = (() => {
  let active = false, sceneId = null, manualPose = null, resolveEnd = null;
  const cine = { pos: new THREE.Vector3(), target: new THREE.Vector3(), fov: 50 };
  const P = (spec, out = new THREE.Vector3()) => {
    if (Array.isArray(spec)) return out.fromArray(spec);
    if (typeof spec === 'string') { const [w, part] = spec.split('.'); const c = Game.who(w); if (c) return c.point(part || 'head', out); const m = Game.G.marker(spec); return m ? out.copy(m.pos) : out; }
    return out;
  };
  async function play(id) {
    const s = CONTENT.scenes[id]; if (!s) { console.error('no scene ' + id); return; }
    active = true; sceneId = id; UI.letterbox(s.letterbox !== false);
    for (const shot of s.shots) {
      if (!active) break;
      const c = shot.cam || {};
      P(c.from || c.at || [0, 1.6, 4], cine.pos); P(c.look || [0, 1.5, 0], cine.target); cine.fov = U.lensToFov(c.lens || 35);
      for (const l of shot.lines || []) { if (!active) break; await Dialogue.say(l.who, l.text, l); }
      if (!(shot.lines || []).length) await Game.G.wait(c.dur || 2);
    }
    active = false; sceneId = null; UI.letterbox(false);
  }
  function camUpdate() {
    const cam = Engine.camera, pose = active ? cine : manualPose || Play.camPose;
    cam.position.copy(pose.pos); cam.lookAt(pose.target);
    if (cam.fov !== pose.fov) { cam.fov = pose.fov; cam.updateProjectionMatrix(); }
  }
  return {
    play, update() {}, camUpdate, stop() { active = false; }, skip() { active = false; },
    manual(p) { manualPose = p; }, get active() { return active; }, get sceneId() { return sceneId; },
  };
})();

// ===== 200_dialogue.js =====
// ============================================================================
// Dialogue — spoken lines (subtitles + face visemes + optional voice), walk-and-talk queue
// with interruption/resume, optional conversations, barks with cooldowns. Owned by: cinema agent.
// THIS IS A STUB: keep every API below, replace the implementation.
//
// CONTRACT
//   Dialogue.say(who, text, {emote, dur, pause, off, via, to}) -> Promise   one line; resolves when it ends.
//        who: speaker id (CONTENT.speakers) — animates Game.who(who) if present (speak visemes, emote, lookAt `to`).
//        via: 'phone'|'radio'|'tape'|'tv'|'recording'|'V.O.' → name suffix "WAI (phone)"; off:true → "[WAI]"
//        dur default = max(1.6, words × 0.32 + 0.6); if SETTINGS.voice, timing follows the voice's end.
//   Dialogue.lineDur(text) -> seconds
//   Dialogue.talk(id, {speakers}) -> Promise   walk-and-talk from CONTENT.talks[id] = {lines, resume, priority, maxDist}
//        pauses when the player is > 12 m from the speaker; interrupted by combat (Dialogue.interrupt()) and resumes with `resume` line
//   Dialogue.optional(id) -> Promise           optional conversation (no letterbox)
//   Dialogue.bark(who, category, {pos}) -> bool  CONTENT.barks[who][category]; 8–20 s per-speaker cooldown, 60 s per exact line
//   Dialogue.interrupt() / Dialogue.resume()
//   Dialogue.busy (a line is playing), Dialogue.stop() (clear everything, flow cancelled)
//   Dialogue.update(dt)
//   Dialogue.speaker(who) -> {name, color, voice}
// ============================================================================
const Dialogue = (() => {
  let busy = false;
  const speaker = who => Object.assign({ name: String(who).toUpperCase(), color: '#B0A8A0', voice: [1, 1] }, CONTENT.speakers[who]);
  const lineDur = text => Math.max(1.6, U.words(text) * 0.32 + 0.6);
  async function say(who, text, o = {}) {
    const sp = speaker(who), dur = o.dur || lineDur(text);
    const c = Game.who(who); if (c) { c.speak(text, dur); if (o.emote) c.emote(o.emote); }
    busy = true;
    UI.subtitle(o.off ? `[${sp.name}]` : sp.name + (o.via ? ` (${o.via})` : ''), text, sp.color);
    try { await Game.G.wait(dur); } finally { UI.subtitle(null); busy = false; }
  }
  return {
    say, lineDur, speaker, talk: async () => {}, optional: async () => {}, bark: () => false, interrupt() {}, resume() {},
    stop() { busy = false; UI.subtitle(null); }, update() {}, get busy() { return busy; },
  };
})();

  const el = (tag, id, cls) => { const e = document.createElement(tag); if (id) e.id = id; if (cls) e.className = cls; root.appendChild(e); return e; };
  function init() {

    lbTop = el('div', null, 'ui-lb'); lbTop.style.top = 0; lbBot = el('div', null, 'ui-lb'); lbBot.style.bottom = 0;

  async function titleText(lines, o = {}) { textEl.innerHTML = lines.map(l => `<div>${l}</div>`).join(''); textEl.style.transition = `opacity ${o.fadeIn ?? 1.5}s`; textEl.style.opacity = 1; await Game.G.wait((o.fadeIn ?? 1.5) + (o.hold ?? 3)); textEl.style.transition = `opacity ${o.fadeOut ?? 1.5}s`; textEl.style.opacity = 0; await Game.G.wait(o.fadeOut ?? 1.5); }
  return {
    init, update() {}, loading, clickToBegin, titleScreen() { Game.newGame(); }, hideMenus() {}, menuOpen: () => false, pauseMenu() {},
    fade, letterbox, subtitle, prompt, card: async () => {}, titleText, phone() {}, hud() {}, skipRing() {},

// ===== 220_save.js =====
// ============================================================================
// Save — checkpoints, progress and settings in localStorage (inside try/catch; the game
// runs normally if storage is blocked). Owned by: core.
// ============================================================================
const Save = (() => {
  const KEY = 'the-last-of-yes.v1';
  const fresh = () => ({ version: 1, checkpoint: null, chapters: [], scenesSeen: [], collectibles: { artifacts: [], lanyards: [], modules: [] }, finished: false, endings: [], settings: null });
  let data = fresh();

  function read() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function write() { try { data.settings = JSON.parse(JSON.stringify(SETTINGS)); localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked: keep going in memory */ } }

  function init() {
    const s = read();
    if (s && s.version === 1) data = Object.assign(fresh(), s);
    if (data.settings) { const v = Object.assign({}, SETTINGS.vol, data.settings.vol); Object.assign(SETTINGS, data.settings); SETTINGS.vol = v; }
  }

  return {
    init, write,
    get data() { return data; },
    hasContinue: () => !!data.checkpoint,
    newGame() { data.checkpoint = null; write(); },
    checkpoint(s) { data.checkpoint = s; write(); },
    unlockChapter(id) { if (!data.chapters.includes(id)) { data.chapters.push(id); write(); } },
    sawScene(id) { if (!data.scenesSeen.includes(id)) { data.scenesSeen.push(id); write(); } },
    seen: id => data.scenesSeen.includes(id),
    collect(kind, id) { const l = data.collectibles[kind]; if (l && !l.includes(id)) { l.push(id); write(); return true; } return false; },
    finish(ending) { data.finished = true; if (!data.endings.includes(ending)) data.endings.push(ending); data.lastEnding = ending; write(); },
    saveSettings: write,
  };
})();

// ===== 230_game.js =====
// ============================================================================
// Game — chapter flow, area loading/unloading, the G API used by content, triggers,
// interactables, checkpoints, death/retry, pause, the per-frame tick. Owned by: core.
//
// Flow model: CONTENT.chapters[id].steps is an ordered list of { id, checkpoint, run: async G => {} }.
// A step with checkpoint:true autosaves when it starts; death/retry restarts the last checkpoint step.
// Every checkpoint step must establish its own state at the start (G.area, G.actor placement, G.player).
// Any G.* promise rejects with Game.ABORT when the flow is cancelled (retry, quit, chapter select);
// Game swallows ABORT, so content never needs to handle it.
// ============================================================================
const Game = (() => {
  const ABORT = Symbol('abort');
  let runId = 0;
  const waits = new Set();              // { check(dt) -> bool, resolve, reject, id }
  let area = null;                      // primary area (the one the player is in)
  const areas = new Map();              // every loaded area by id (usually just one; scenes may intercut two)
  const actors = {};                    // persistent named characters (chase, chloe, …)
  let flags = {};
  let chapterId = null, stepIndex = 0, lastCheckpoint = null;
  let paused = false, state = 'boot', time = 0, timeScale = 1;
  let focusIt = null;                   // interactable currently prompted

  // ---- areas -------------------------------------------------------------
  // Area context. Everything inside def.build(A) is in AREA-LOCAL coordinates: A.group sits at def.origin,
  // and A.marker / A.interactable / A.char / A.collider / A.w() convert local -> world.
  function makeArea(id) {
    const def = CONTENT.levels[id];
    if (!def) throw new Error('Unknown area ' + id);
    const origin = U.v3(def.origin || [0, 0, 0]).clone();
    const w = (p, out = new THREE.Vector3()) => U.v3(p, out).add(origin);
    const A = {
      id, def, origin, w, group: new THREE.Group(), markers: {}, interactables: [], updaters: [], chars: [], data: {},
      add(o) { A.group.add(o); return o; },
      marker(name, pos, yaw = 0) { A.markers[name] = { pos: w(pos), yaw }; return A.markers[name]; },
      update(fn) { A.updaters.push(fn); return fn; },
      // Interactable: { id, at:[x,y,z] (local), r, prompt:'e – look', once, cond:()=>bool, use: async (G, it) => {} }
      interactable(o) { const it = Object.assign({ r: 1.4, once: true, used: false }, o); it.pos = w(o.at); A.interactables.push(it); return it; },
      // Area-local character (disposed with the area). o.at is local unless it is a marker name.
      char(defId, o = {}) { const c = Chars.create(defId, o); place(c, typeof o.at === 'string' ? o.at : w(o.at ?? [0, 0, 0]), o.yaw); A.chars.push(c); return c; },
      collider: (min, max, o) => World.addBox(w(min), w(max), o),
      surface: (x1, z1, x2, z2, name) => World.addSurface(x1 + origin.x, z1 + origin.z, x2 + origin.x, z2 + origin.z, name),
    };
    A.group.name = 'area:' + id;
    A.group.position.copy(origin);
    A.group.updateMatrixWorld(true);
    return A;
  }

  function disposeObject(root) {
    root.traverse(o => {
      if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
      const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      for (const m of ms) if (!m.userData.shared) { for (const k in m) { const v = m[k]; if (v && v.isTexture && !v.userData.shared) v.dispose(); } m.dispose(); }
      if (o.isLight && o.shadow && o.shadow.map) o.shadow.map.dispose();
    });
  }

  function unloadArea(id) {
    const A = areas.get(id); if (!A) return;
    try { A.def.unload && A.def.unload(A); } catch (e) { console.error(e); }
    for (const c of A.chars) c.dispose();
    Engine.scene.remove(A.group);
    disposeObject(A.group);
    World.clear(id);
    areas.delete(id);
    if (area === A) area = null;
  }

  // Load an area and make it primary. By default every other area is unloaded; {keep:true} keeps them
  // (for scenes that intercut two places — give such areas distinct def.origin offsets).
  async function loadArea(id, o = {}) {
    if (area && area.id === id && !o.reload) return area;
    if (!o.keep) { AI.clear(); for (const k of [...areas.keys()]) if (k !== id) unloadArea(k); }
    let A = areas.get(id);
    if (!A) {
      A = makeArea(id);
      areas.set(id, A);
      World.owner = id;
      Build.begin(A);
      try { A.def.build(A); } finally { Build.end(A); World.owner = null; }
      Engine.scene.add(A.group);
    }
    area = A;
    applyLook(A.def);
    Engine.renderer.compile(Engine.scene, Engine.camera);
    return A;
  }
  // Fog, background, environment, grade, ambience of an area (also used when a scene cuts between areas).
  function applyLook(d) {
    Engine.setGrade(d.grade || 'neutral');
    Engine.scene.fog = d.fog ? (d.fog.density != null ? new THREE.FogExp2(d.fog.color, d.fog.density) : new THREE.Fog(d.fog.color, d.fog.near, d.fog.far)) : null;
    Engine.scene.background = d.background != null ? (d.background.isTexture ? d.background : new THREE.Color(d.background)) : new THREE.Color(d.fog ? d.fog.color : 0x000000);
    Engine.setEnv(d.env ?? null);
    World.baseSurface = d.surface || 'concrete';
    Audio.amb(d.amb || null, 1.5);
  }

  // ---- characters --------------------------------------------------------
  function resolveAt(at) {
    if (at == null) return null;
    if (typeof at === 'string') { let m = area && area.markers[at]; if (!m) for (const A of areas.values()) if (A.markers[at]) { m = A.markers[at]; break; } if (!m) { console.warn('missing marker ' + at); return { pos: new THREE.Vector3(), yaw: 0 }; } return m; }
    if (at.isVector3) return { pos: at, yaw: undefined };
    if (Array.isArray(at)) return { pos: U.v3(at), yaw: undefined };
    return at; // {pos,yaw}
  }
  function place(c, at, yaw) {
    const m = resolveAt(at);
    if (m) c.root.position.copy(m.pos);
    const y = yaw ?? m?.yaw; if (y != null) c.yaw = y;
    if (c.stop) c.stop();
    return c;
  }
  // Get or create a persistent named actor. defId defaults to id.
  function actor(id, defId, at, yaw) {
    let c = actors[id];
    if (c && defId && c.def.id !== defId) { c.dispose(); c = null; }
    if (!c) { c = actors[id] = Chars.create(defId || id, { name: id }); }
    c.setVisible(true);
    if (at != null) place(c, at, yaw);
    return c;
  }
  function removeActor(id) { const c = actors[id]; if (c) { c.dispose(); delete actors[id]; } }
  // Look up any speaker/actor by id (persistent actors first, then area chars with .name)
  function who(id) { if (!id) return null; if (typeof id !== 'string') return id; if (actors[id]) return actors[id]; for (const A of areas.values()) { const c = A.chars.find(c => c.name === id); if (c) return c; } return AI.byName?.(id) || null; }

  // ---- waits ---------------------------------------------------------------
  function wait(check) {
    const my = runId;
    return new Promise((resolve, reject) => { const w = { check, resolve, reject, id: my }; waits.add(w); });
  }
  function guard(p) { const my = runId; return Promise.resolve(p).then(v => { if (my !== runId) throw ABORT; return v; }); }
  const flowIts = [];                   // interactables created by G.interact (retired on cancel)
  function cancelWaits() { for (const w of waits) w.reject(ABORT); waits.clear(); for (const it of flowIts) it.used = true; flowIts.length = 0; }

  // ---- G: the API content uses --------------------------------------------
  const G = {
    ABORT,
    area: (id, o) => guard(loadArea(id, o)),
    unload: id => unloadArea(id),
    look: id => applyLook(CONTENT.levels[id]),
    get A() { return area; },
    areaById: id => areas.get(id),
    get t() { return time; },
    get actors() { return actors; },
    flags: new Proxy({}, { get: (_, k) => flags[k], set: (_, k, v) => { flags[k] = v; return true; } }),
    actor, removeActor, who, place,
    marker: name => resolveAt(name),
    scene: (id, opts) => guard(Director.play(id, opts)),
    player: (id, profile) => { const c = typeof id === 'string' ? actor(id) : id; Play.setPlayer(c, profile); return c; },
    control: on => Play.enable(on),
    wait: sec => { let t = 0; return wait(dt => (t += dt) >= sec); },
    until: fn => wait(() => fn()),
    // resolves when the player enters a sphere {at, r} or rectangle {box:[x1,z1,x2,z2]}
    zone: o => { const p = o.at && U.v3(o.at); return wait(() => { const pl = Play.char; if (!pl) return false; const q = pl.root.position; return o.box ? (q.x >= Math.min(o.box[0], o.box[2]) && q.x <= Math.max(o.box[0], o.box[2]) && q.z >= Math.min(o.box[1], o.box[3]) && q.z <= Math.max(o.box[1], o.box[3])) : q.distanceTo(p) <= (o.r ?? 2); }); },
    // resolves when the player uses it. o: {at, r, prompt, face}
    interact: o => {
      let it = null;
      const p = wait(() => it.used);
      it = area.interactable(Object.assign({ prompt: 'e – interact' }, o, { use: () => { it.used = true; } }));
      flowIts.push(it);
      return p;
    },
    say: (w, text, o) => guard(Dialogue.say(w, text, o)),
    talk: (id, o) => guard(Dialogue.talk(id, o)),
    fade: (to, dur = 1) => guard(UI.fade(to, dur)),
    card: id => guard(UI.card(id)),
    title: (lines, o) => guard(UI.titleText(lines, o)),
    music: (id, o) => Audio.music(id, o),
    sfx: (id, o) => Audio.sfx(id, o),
    amb: (id, fade) => Audio.amb(id, fade),
    spawn: (type, at, o = {}) => AI.spawn(type, resolveAt(at), o),
    hook: (name, args) => guard(CONTENT.hooks[name](G, args)),
    grade: (g, dur) => Engine.setGrade(g, dur),
    save: () => saveCheckpoint(),
  };

  // ---- flow ----------------------------------------------------------------
  function snapshot() { return { chapter: chapterId, step: CONTENT.chapters[chapterId].steps[stepIndex].id, inv: Play.inventory ? JSON.parse(JSON.stringify(Play.inventory)) : null, flags: JSON.parse(JSON.stringify(flags)) }; }
  function saveCheckpoint() { lastCheckpoint = snapshot(); Save.checkpoint(lastCheckpoint); }

  async function runFrom(chId, stepId) {
    const my = ++runId; cancelWaits(); Director.stop(); Dialogue.stop(); UI.prompt(null);
    state = 'play'; paused = false;
    chapterId = chId;
    const ch = CONTENT.chapters[chId];
    if (!ch) { console.error('no chapter ' + chId); return; }
    let i = stepId ? ch.steps.findIndex(s => s.id === stepId) : 0;
    if (i < 0) i = 0;
    Save.unlockChapter(chId);
    for (; i < ch.steps.length; i++) {
      if (my !== runId) return;
      stepIndex = i;
      const st = ch.steps[i];
      if (st.checkpoint) saveCheckpoint();
      try { await st.run(G); }
      catch (e) { if (e === ABORT) return; console.error(e); return; }
    }
    if (my !== runId) return;
    const order = CONTENT.chapterOrder, next = order[order.indexOf(chId) + 1];
    if (next && CONTENT.chapters[next]) return runFrom(next);
    UI.endOfBuild();
  }

  function newGame() { flags = {}; if (Play.resetInventory) Play.resetInventory(); Save.newGame(); return startChapter(CONTENT.chapterOrder[0]); }
  function continueGame() { const s = Save.data.checkpoint; if (!s) return newGame(); restore(s); return runFrom(s.chapter, s.step); }
  function startChapter(chId, stepId) { flags = {}; if (Play.resetInventory) Play.resetInventory(); UI.hideMenus && UI.hideMenus(); return runFrom(chId, stepId); }
  function restore(s) { flags = JSON.parse(JSON.stringify(s.flags || {})); if (s.inv && Play.setInventory) Play.setInventory(s.inv); }
  function retry() { const s = lastCheckpoint || Save.data.checkpoint; if (!s) return; restore(s); return runFrom(s.chapter, s.step); }
  async function die(cause) {
    if (state !== 'play') return;
    const my = runId;
    Play.enable(false);
    await UI.death(cause);
    if (my === runId) retry();
  }
  function quitToTitle() { ++runId; cancelWaits(); Director.stop(); Dialogue.stop(); paused = false; titleScreen(); }

  async function titleScreen() {
    state = 'title';
    Play.enable(false); Play.setPlayer(null);
    for (const k in actors) actors[k].setVisible(false);
    if (CONTENT.levels.TITLE) await loadArea('TITLE');
    UI.titleScreen();
  }

  function setPaused(p) {
    if (state !== 'play' || paused === p) return;
    paused = p;
    Engine.uniforms.uDesat.value = p ? 0.35 : 0;
    Audio.pause && Audio.pause(p);
    if (p) { Input.unlock(); UI.pauseMenu(true); } else { UI.pauseMenu(false); Input.lock(); }
  }

  // ---- interactables -------------------------------------------------------
  const tmpV = new THREE.Vector3();
  function updateInteract() {
    let best = null, bd = 1e9;
    const pl = Play.char;
    if (area && pl && Play.enabled && !Director.active) {
      const p = pl.root.position;
      for (const A of areas.values()) for (const it of A.interactables) {
        if (it.used || (it.cond && !it.cond())) continue;
        const d = tmpV.copy(it.pos).setY(p.y).distanceTo(p);
        if (d > it.r || Math.abs(it.pos.y - p.y) > 2.2) continue;
        if (d < bd) { bd = d; best = it; }
      }
    }
    if (best !== focusIt) { focusIt = best; UI.prompt(best ? best.prompt : null); }
    if (best && Input.pressed('interact')) {
      if (best.once) best.used = true;
      focusIt = null; UI.prompt(null);
      const r = best.use && best.use(G, best);
      if (r && r.catch) r.catch(e => { if (e !== ABORT) console.error(e); });
    }
  }

  // ---- tick ----------------------------------------------------------------
  function tick(dt) {
    Input.update(dt);
    if (state === 'play' && Input.pressed('pause') && !UI.menuOpen?.()) setPaused(!paused);
    if (paused || state === 'boot') { UI.update(dt); Audio.update(dt); return; }
    const sdt = dt * timeScale;
    time += sdt;
    Director.update(sdt);
    Play.update(sdt);
    AI.update(sdt);
    for (const A of areas.values()) for (const f of A.updaters) f(sdt, time);
    Chars.update(sdt);
    Dialogue.update(sdt);
    for (const w of waits) { let done = false; try { done = w.check(sdt); } catch (e) { console.error(e); done = true; } if (done) { waits.delete(w); w.resolve(); } }
    updateInteract();
    Director.camUpdate(dt);
    UI.update(dt);
    Audio.update(dt);
  }

  return {
    ABORT, G, tick, loadArea, unloadArea, applyLook, areas, actor, who, place, newGame, continueGame, startChapter, runFrom, retry, die, quitToTitle, titleScreen, setPaused,
    get area() { return area; }, get actors() { return actors; }, get state() { return state; }, set state(s) { state = s; },
    get paused() { return paused; }, get time() { return time; }, get chapter() { return chapterId; },
    get timeScale() { return timeScale; }, set timeScale(v) { timeScale = v; }, flags: () => flags,
  };
})();

// ===== 900_main.js =====
// ============================================================================
// Main — boot, loading screen, "click to begin", the frame loop, dev hooks. Owned by: core.
// Dev URL params (with ?dev):
//   goto=chapter[:stepId]  start the flow there (skips boot + title)
//   scene=ID               load the scene's area and play the scene
//   area=ID                load an area with Chase as free-roam player at marker mk_start (or origin)
//   test=name              run CONTENT.dev[name](G)
//   title                  go straight to the title screen
// window.GAME.dev.ff(sec) fast-forwards game time with fixed steps (used by tools/shot.mjs).
// ============================================================================
(() => {
  let last = performance.now(), ffActive = false;
  const errorsShown = new Set();
  addEventListener('unhandledrejection', e => { if (e.reason === Game.ABORT) e.preventDefault(); });

  function frame(now) {
    requestAnimationFrame(frame);
    if (ffActive) return;
    const dt = Math.min((now - last) / 1000, CONFIG.maxDt); last = now;
    try { Game.tick(dt); Engine.render(dt); }
    catch (e) { const k = String(e && e.message); if (!errorsShown.has(k)) { errorsShown.add(k); console.error(e); } }
  }

  const macro = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
  const dev = {
    async ff(sec) { ffActive = true; try { const n = Math.round(sec / CONFIG.fixedDt); for (let i = 0; i < n; i++) { Game.tick(CONFIG.fixedDt); await macro(); } } finally { ffActive = false; last = performance.now(); } },
    render() { Engine.render(0.0001, false); },
    goto: (ch, step) => Game.startChapter(ch, step),
    scene: async id => { const s = CONTENT.scenes[id]; if (s && s.area) await Game.loadArea(s.area); Game.state = 'play'; return Director.play(id); },
    area: async id => { await Game.loadArea(id); Game.state = 'play'; const c = Game.actor('chase', 'chase', Game.area.markers.mk_start ? 'mk_start' : [0, 0, 0]); Play.setPlayer(c, {}); Play.enable(true); },
  };
  window.GAME = { ready: false, dev, Engine, Game, Director, Play, Chars, UI, Audio, Tex, Build, World, AI, Dialogue, Save, Input, CONTENT, THREE, SETTINGS };

  async function boot() {
    Save.init();
    Engine.init(document.getElementById('app'));
    Input.init();
    UI.init();
    UI.loading(0);
    requestAnimationFrame(frame);
    // Pre-build procedural assets in slices so the loading percentage moves.
    const jobs = [...(Tex.preload ? Tex.preload() : []), ...(Chars.preload ? Chars.preload() : [])];
    for (let i = 0; i < jobs.length; i++) { jobs[i](); UI.loading((i + 1) / jobs.length); if (i % 3 === 2) await macro(); }
    UI.loading(1);
    const p = PARAMS;
    if (CONFIG.dev && (p.has('goto') || p.has('scene') || p.has('area') || p.has('test') || p.has('title'))) {
      UI.loading(null);
      Audio.init();
      window.GAME.ready = true;
      if (p.has('goto')) { const [ch, st] = p.get('goto').split(':'); Game.startChapter(ch, st); }
      else if (p.has('scene')) dev.scene(p.get('scene'));
      else if (p.has('area')) dev.area(p.get('area'));
      else if (p.has('test')) { Game.state = 'play'; CONTENT.dev[p.get('test')](Game.G); }
      else Game.titleScreen();
      return;
    }
    window.GAME.ready = true;
    await UI.clickToBegin();       // unlocks audio
    Audio.init();
    Game.titleScreen();
  }
  boot().catch(e => console.error(e));
})();
